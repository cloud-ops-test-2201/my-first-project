name: arc-heavy
on: workflow_dispatch
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        runner: [arc-runner-set, ubuntu-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Machine info
        run: |
          echo "Runner type: ${{ matrix.runner }}"
          echo "CPUs: $(nproc)"
          free -h

      - name: Checkout a real project (Express)
        uses: actions/checkout@v4
        with:
          repository: expressjs/express
          path: app

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: npm install
        working-directory: app
        run: time npm install

      - name: Run tests
        working-directory: app
        run: time npm test

      - name: Docker build
        working-directory: app
        run: |
          cat > Dockerfile <<'EOF'
          FROM node:20-slim
          WORKDIR /app
          COPY package.json ./
          RUN npm install --omit=dev
          COPY . .
          CMD ["node", "-e", "console.log('built ok')"]
          EOF
          time docker build -t heavy-test .
          docker run --rm heavy-test
